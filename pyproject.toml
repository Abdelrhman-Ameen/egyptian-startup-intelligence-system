[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ventureguard"
version = "1.0.0"
description = "Reproducible financial-risk research and cash-flow scenario planning"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "joblib", "fastapi", "uvicorn"]

[project.optional-dependencies]
train = ["torch"]
test = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
